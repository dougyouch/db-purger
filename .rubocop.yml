Naming/FileName:
  Enabled: false
Layout/LineLength:
  Max: 120
Metrics/ModuleLength:
  Max: 120
Metrics/MethodLength:
  Max: 20
AllCops:
  Exclude:
    - 'spec/factories/test_factory.rb'
    - 'spec/support/db/schema.rb'
    - 'spec/support/test_db.rb'
    - 'spec/**/*_spec.rb'
    - 'spec/**/*.plan.rb'
